name: Something isn't working
description: Ducter did something wrong, or didn't do what it said it would.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. `ducter up`
        2. Sent "…"
        3. …
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `ducter version`.
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Mac app
        - Command line on a Mac
        - Linux server
        - Phone (web client)
        - Worker machine
  - type: textarea
    id: doctor
    attributes:
      label: ducter doctor
      description: Paste the output of `ducter doctor`. Remove anything private (paths, hostnames, repo names) first.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. `~/.ducter/ducter.log` (or `~/.ducter/app.log` for the Mac app). Please check them for secrets before pasting.
  - type: markdown
    attributes:
      value: Found a security problem? Please don't file it here; see SECURITY.md.
