name: CI

# Every PR and every push to main. Four jobs in parallel, a few minutes each:
#   ts  bun test (0 failures), both tsc configs, the committed web bundle is fresh, Markdown links
#       resolve, no work evidence in git
#   go  apps/desktop: gofmt, go vet (darwin + linux), go test, and a darwin build; go-views runs
#       the second half of the view tests beside it (D488)
#   android  apps/android: its unit tests and a debug APK (D178)
# The Go job runs on macOS, the app's only platform: its view tests measure text with the real
# font stack and use macOS tools (plutil). On Linux the same layout measured differently and
# failed. macOS runners cost 10x the minutes on a private repo; they are free on a public one.
# The macOS app, the Linux bundles, the Android APK and the iPhone app are built by release.yml
# on a v* tag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Bun the committed web bundle (apps/web/static) is built with. A different Bun minifies
  # differently, and the bundle test then fails. Release builds of the CLI use build.sh's pin.
  BUN_VERSION: "1.4.4"

jobs:
  ts:
    name: bun test + tsc + web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Typecheck (tsconfig.json, apps/web/tsconfig.json)
        run: bun run typecheck

      - name: Web bundle is fresh (apps/web/static matches apps/web/src)
        run: |
          bun run build:web
          if ! git diff --exit-code --stat -- apps/web/static; then
            echo "::error::apps/web/static is stale. Run 'bun run build:web' (Bun $BUN_VERSION) and commit it."
            exit 1
          fi

      # The site's tests read its built pages and import its Markdown pipeline (apps/site has its
      # own lockfile, not part of the root install), so the site is installed and built first.
      - name: Site install and build (for the site's tests)
        working-directory: apps/site
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: bun test
        run: bun run test

      - name: Markdown links resolve
        run: bun scripts/check-links.ts

      # Here, not in the Go job: that job has no Bun and runs in apps/desktop.
      - name: No work evidence or build output in git
        run: bun scripts/check-binaries.ts

      - name: Shell scripts parse
        run: for f in scripts/*.sh scripts/ci/*.sh packages/cli/build.sh apps/site/public/install.sh; do bash -n "$f"; done

  go:
    name: desktop (Go)
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet (darwin and linux)
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          go vet ./...

      - name: go build (darwin/arm64, the app's target)
        run: go build -trimpath -o /dev/null .

      # The view tests are most of this job (about 4 of its 5 minutes, one package run serially), so
      # they are split in two (D488): Test[A-K] and the 50,000-event TestLongSession* here with every
      # other package, the rest in go-views (measured on CI: A-K alone 2m42 and 3m58, A-M 4m45 and 3m18).
      # The two -run/-skip patterns are each other's complement, so no test is left out.
      - name: go test (all but the views, and views Test[A-K] and TestLongSession*)
        run: |
          go test $(go list ./... | grep -v '/internal/views$')
          go test ./internal/views -run '^Test([A-K]|LongSession)'

  go-views:
    name: desktop (Go views, the rest)
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: go test (views, the rest)
        run: go test ./internal/views -skip '^Test([A-K]|LongSession)'

  android:
    name: Android app (unit tests, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and a debug build (debug key; release signing is release.yml's)
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
