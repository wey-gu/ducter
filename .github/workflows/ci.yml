name: CI

# Every PR and every push to main. Two Linux jobs in parallel, a few minutes each:
#   ts  bun test (0 failures), both tsc configs, the committed web bundle is fresh, Markdown links
#       resolve
#   go  apps/desktop: gofmt, go vet (darwin + linux), go test, and a darwin build
# MyGo binds AppKit through purego (no cgo), so the darwin build cross-compiles on Linux and the
# tests run there too; nothing here needs a macOS runner (10x the minutes on a private repo).
# The macOS app, the Linux bundles and the iPhone app are built by release.yml on a v* tag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Bun the committed web bundle (apps/web/static) is built with. A different Bun minifies
  # differently, and the bundle test then fails. Release builds of the CLI use build.sh's pin.
  BUN_VERSION: "1.4.4"

jobs:
  ts:
    name: bun test + tsc + web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Typecheck (tsconfig.json, apps/web/tsconfig.json)
        run: bun run typecheck

      - name: Web bundle is fresh (apps/web/static matches apps/web/src)
        run: |
          bun run build:web
          if ! git diff --exit-code --stat -- apps/web/static; then
            echo "::error::apps/web/static is stale. Run 'bun run build:web' (Bun $BUN_VERSION) and commit it."
            exit 1
          fi

      - name: bun test
        run: bun test

      - name: Markdown links resolve
        run: bun scripts/check-links.ts

      - name: Shell scripts parse
        run: for f in scripts/*.sh scripts/ci/*.sh packages/cli/build.sh; do bash -n "$f"; done

  go:
    name: desktop (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet (darwin and linux)
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          go vet ./...

      - name: go build (darwin/arm64, the app's target)
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -o /dev/null .

      - name: go test
        run: go test ./...

      - name: No work evidence or build output in git
        run: bun scripts/check-binaries.ts
