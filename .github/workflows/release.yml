name: Release

# On a v* tag (v0.1.0, v0.2.0-beta.1, …), builds and ships everything:
#
#   meta      the tag's version must equal packages/cli/package.json's (the app reads it there)
#   macos     Ducter.app + DMG via scripts/make-app.sh: Developer ID signed, notarized with the
#             App Store Connect API key, stapled, checked by spctl (make-app.sh does all of it)
#   linux     linux-arm64 and linux-x64 bundles via scripts/install.sh --linux, as tarballs
#   android   the Android app (apps/android) as Ducter-<version>-android.apk, signed with the
#             release key from secrets; skipped, with a warning, while ANDROID_KEYSTORE_BASE64
#             isn't set (design/release/android.md). The app updates itself from this file.
#   ios       the iPhone app (apps/ios) to TestFlight; skipped, with a notice, while apps/ios
#             isn't on the tagged commit or its secrets aren't set. Never blocks the release.
#   release   one GitHub Release: DMG, tarballs, SHA256SUMS.txt, notes from CHANGELOG.md or the
#             commits since the previous tag. Drafted first, published once every file is up.
#             Tags with a "-" (v0.2.0-beta.1) are marked pre-release.
#
# Secrets (names as con's; scripts/ci/setup-github-secrets.sh sets them): see design/release/README.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # build.sh pins this Bun for the compiled `ducter` binary (research/18).
  BUN_VERSION: "1.4.4"
  APPLE_TEAM_ID: JMU55RJW2K

jobs:
  meta:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      marketing: ${{ steps.v.outputs.marketing }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' packages/cli/package.json | head -1)"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is $version, packages/cli/package.json says $pkg. Bump the package, commit, tag again."
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          # App Store marketing versions are digits only: 0.2.0-beta.1 ships to TestFlight as 0.2.0.
          {
            echo "version=$version"
            echo "marketing=${version%%[-+]*}"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

  macos:
    name: macOS app (signed, notarized)
    needs: meta
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: scripts/ci/import-certificate.sh

      - name: Write the App Store Connect API key
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
        run: |
          set -eu
          [ -n "$APPLE_NOTARY_KEY_ID" ] && [ -n "$APPLE_NOTARY_API_KEY_BASE64" ] ||
            { echo "::error::APPLE_NOTARY_KEY_ID / APPLE_NOTARY_API_KEY_BASE64 are not set (design/release/README.md)"; exit 1; }
          key="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          (umask 077; printf '%s' "$APPLE_NOTARY_API_KEY_BASE64" | base64 --decode >"$key")
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo "::error::APPLE_NOTARY_API_KEY_BASE64 is not a base64 .p8"; exit 1; }
          echo "APPLE_NOTARY_KEY_PATH=$key" >>"$GITHUB_ENV"

      - name: Build, sign, notarize, staple (scripts/make-app.sh)
        env:
          DUCTER_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DUCTER_REQUIRE_NOTARIZATION: "1"
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          [ -n "$DUCTER_SIGN_IDENTITY" ] || { echo "::error::APPLE_SIGNING_IDENTITY is not set"; exit 1; }
          scripts/make-app.sh "$RUNNER_TEMP/out"

      - name: Check the artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          out="$RUNNER_TEMP/out"
          dmg="$out/Ducter-$VERSION-arm64.dmg"
          test -f "$dmg"
          # make-app.sh already ran spctl and stapler; say it again in this job's log, from the DMG.
          spctl -a -t open --context context:primary-signature -v "$dmg"
          xcrun stapler validate "$dmg"
          codesign -dv --verbose=2 "$out/Ducter.app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Runtime)'
          mkdir -p "$RUNNER_TEMP/upload"
          cp "$dmg" "$RUNNER_TEMP/upload/"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: scripts/ci/import-certificate.sh --delete

  linux:
    name: Linux bundles (arm64, x64)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build (scripts/install.sh --linux)
        run: sh scripts/install.sh --linux "$RUNNER_TEMP/linux"

      - name: Smoke-run the x64 binary, pack tarballs
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          "$RUNNER_TEMP/linux/linux-x64/ducter" version
          mkdir -p "$RUNNER_TEMP/upload"
          for arch in arm64 x64; do
            name="ducter-$VERSION-linux-$arch"
            # The tarball unpacks to one folder: ducter + install.sh (run its install.sh there).
            mv "$RUNNER_TEMP/linux/linux-$arch" "$RUNNER_TEMP/linux/$name"
            tar -C "$RUNNER_TEMP/linux" -czf "$RUNNER_TEMP/upload/$name.tar.gz" "$name"
          done
          ls -l "$RUNNER_TEMP/upload"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error

  ios:
    name: iPhone app to TestFlight
    needs: meta
    # Xcode 26 / the iOS 26 SDK, which App Store Connect requires for uploads.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # A separate Admin key may be set as ASC_*; otherwise the notary key is used.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPLE_NOTARY_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPLE_NOTARY_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 || secrets.APPLE_NOTARY_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Is there an iPhone app to ship?
        id: gate
        run: |
          if [ ! -f apps/ios/project.yml ] && [ ! -d apps/ios/Ducter.xcodeproj ]; then
            echo "::notice::No apps/ios on $GITHUB_REF_NAME; nothing for TestFlight."
            echo "ship=false" >>"$GITHUB_OUTPUT"
          elif [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_BASE64" ]; then
            echo "::warning::No App Store Connect API key in secrets; skipping TestFlight (design/release/README.md)."
            echo "ship=false" >>"$GITHUB_OUTPUT"
          else
            echo "ship=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.ship == 'true'

      - name: Archive, sign, upload (scripts/ci/testflight.sh)
        if: steps.gate.outputs.ship == 'true'
        env:
          MARKETING_VERSION: ${{ needs.meta.outputs.marketing }}
          # Unique and increasing per upload: the release run number, plus the attempt on a re-run.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          # D176: the iOS 27.1 SDK, so iPhone Duo shows the app full-screen; the default Xcode when absent.
          DUCTER_XCODE: "27.1"
        run: scripts/ci/testflight.sh

  android:
    name: Android app (signed APK)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Is there a release key?
        id: gate
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 in secrets; this release has no Android APK (design/release/android.md)."
            echo "ship=false" >>"$GITHUB_OUTPUT"
          else
            echo "ship=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ship == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.ship == 'true'

      - name: Write the release keystore
        if: steps.gate.outputs.ship == 'true'
        run: |
          set -eu
          ks="$RUNNER_TEMP/ducter-release.jks"
          (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$ks")
          echo "DUCTER_ANDROID_KEYSTORE=$ks" >>"$GITHUB_ENV"

      - name: Unit tests, signed release build (apps/android)
        if: steps.gate.outputs.ship == 'true'
        working-directory: apps/android
        env:
          DUCTER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DUCTER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DUCTER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Check the APK (package, version, signing certificate)
        if: steps.gate.outputs.ship == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          # A repository variable, not a secret: the release certificate's SHA-256. Every APK must
          # carry it, or no phone that has Ducter could take the update (research/51 §2).
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/aapt2" dump badging "$apk" | head -1 | tee "$RUNNER_TEMP/badging.txt"
          grep -q "name='co.nowledge.ducter.android'" "$RUNNER_TEMP/badging.txt" || { echo "::error::wrong package"; exit 1; }
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt" || { echo "::error::versionName is not $VERSION"; exit 1; }
          "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          got="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1)"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then echo "::error::signed with a debug key"; exit 1; fi
          if [ -n "$CERT_SHA256" ]; then
            [ "$got" = "$(printf '%s' "$CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')" ] || { echo "::error::signed by $got, not the release certificate ANDROID_CERT_SHA256"; exit 1; }
          else
            echo "::warning::ANDROID_CERT_SHA256 (a repository variable) is not set; the signing certificate ($got) was not checked against it."
          fi
          mkdir -p "$RUNNER_TEMP/upload"
          # The app's updater (apps/android Updater.kt) looks for exactly this name.
          cp "$apk" "$RUNNER_TEMP/upload/Ducter-$VERSION-android.apk"

      - uses: actions/upload-artifact@v5
        if: steps.gate.outputs.ship == 'true'
        with:
          name: android
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ducter-release.jks"

  release:
    name: GitHub Release
    needs: [meta, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release notes read the commits since the previous tag

      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -eu
          (cd assets && sha256sum -- * >SHA256SUMS.txt && cat SHA256SUMS.txt)
          # The app's updater (apps/desktop/internal/update) reads this release through the API
          # and needs exactly these names: Ducter-<version>-arm64.dmg, listed in SHA256SUMS.txt.
          grep -q "  Ducter-${GITHUB_REF_NAME#v}-arm64.dmg\$" assets/SHA256SUMS.txt ||
            { echo "::error::SHA256SUMS.txt doesn't list Ducter-${GITHUB_REF_NAME#v}-arm64.dmg (the updater needs it)"; exit 1; }
          scripts/ci/release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
          # D172: the cards' what's new comes only from this block (zh and en); without it they show none.
          grep -q '<!-- whats-new' "$RUNNER_TEMP/notes.md" ||
            echo "::warning::CHANGELOG.md's section for $GITHUB_REF_NAME has no whats-new block: device cards will show no what's new (design/release/README.md)"
          v="${GITHUB_REF_NAME#v}"
          cat >>"$RUNNER_TEMP/notes.md" <<EOF

          ## Install

          - **Mac:** open the \`.dmg\` and drag Ducter to Applications.
          - **Android:** on the phone, open \`Ducter-$v-android.apk\` and allow the install once;
            after that the app updates itself from here.
          - **Linux server:** take the tarball for \`uname -m\` (aarch64 → arm64, x86_64 → x64), e.g.
            \`tar xzf ducter-$v-linux-x64.tar.gz && sh ducter-$v-linux-x64/install.sh --service\`.
          - Check a download: \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`.
          EOF
          # No Android key in secrets yet (the android job skipped): no Android line.
          [ -f "assets/Ducter-$v-android.apk" ] || sed -i '/\*\*Android:\*\*/,+1d' "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Draft, upload, publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          # Drafts stay invisible until every file is attached; a re-run reuses the release.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags="--draft"
            [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
            # shellcheck disable=SC2086
            gh release create "$tag" --title "Ducter ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md" $flags
          fi
          for f in assets/*; do gh release upload "$tag" "$f" --clobber; done
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json url,assets --jq '.url, (.assets[].name)'
