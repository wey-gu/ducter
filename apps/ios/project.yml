# The Ducter iPhone app: a native shell around the phone client the main serves at /app.
# Generate the Xcode project with `xcodegen` (brew install xcodegen); see design/release/ios.md.
name: Ducter
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    # CI overrides both on the xcodebuild command line (MARKETING_VERSION=… CURRENT_PROJECT_VERSION=…).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Ducter:
    type: application
    platform: iOS
    sources:
      - path: Ducter
      - path: Shared
      - path: LiveShared
      # D537: the share sheet's screen and sending; the app empties its outbox and shows its specimen.
      - path: ShareKit
    dependencies:
      # Opens sealed notifications (D159); embedded in the app's PlugIns.
      - target: DucterNotify
      # D306: draws the Lock Screen glance (Live Activities); embedded in the app's PlugIns.
      - target: DucterLive
      # D537: 分享到 Ducter / Share to Ducter, the share sheet's Ducter; embedded in the app's PlugIns.
      - target: DucterShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUCTER_BUNDLE_ID)
        INFOPLIST_FILE: Ducter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ducter/Ducter.entitlements
        CODE_SIGN_STYLE: Automatic
        # iPhone and iPad, one universal app (D176).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          # App Store / TestFlight builds talk to production APNs (the entitlement is rewritten
          # to "production" by distribution signing; Native.apnsEnv follows the configuration).
          SWIFT_OPTIMIZATION_LEVEL: -O
  DucterNotify:
    # The Notification Service Extension (D159): puts the real words back into a sealed alert.
    # Its own App ID, <app id>.notify; automatic signing (CI: -allowProvisioningUpdates with the
    # App Store Connect key) registers it and makes its profile. No capability beyond keychain
    # sharing, which every profile allows within the team.
    type: app-extension
    platform: iOS
    sources:
      - path: DucterNotify
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUCTER_BUNDLE_ID).notify
        INFOPLIST_FILE: DucterNotify/Info.plist
        CODE_SIGN_ENTITLEMENTS: DucterNotify/DucterNotify.entitlements
        CODE_SIGN_STYLE: Automatic
        # iPhone and iPad, one universal app (D176).
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
  DucterLive:
    # D306: the widget extension that draws the Live Activity the app starts (LiveShared). Its own
    # App ID, <app id>.live; no capability of its own (the push goes to the app's topic).
    type: app-extension
    platform: iOS
    sources:
      - path: DucterLive
      - path: LiveShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUCTER_BUNDLE_ID).live
        INFOPLIST_FILE: DucterLive/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
  DucterShare:
    # D537: the Share Extension (com.apple.share-services). Its own App ID, <app id>.share; the
    # App Groups capability (group.<app id>, shared with the app) and the keychain group. Automatic
    # signing (CI: -allowProvisioningUpdates with the App Store Connect key) registers both.
    type: app-extension
    platform: iOS
    sources:
      - path: DucterShare
      - path: ShareKit
      - path: Shared
      - path: Ducter/Theme.swift
      - path: Ducter/Fonts/BricolageGrotesque.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUCTER_BUNDLE_ID).share
        INFOPLIST_FILE: DucterShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: DucterShare/DucterShare.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
schemes:
  Ducter:
    build:
      targets:
        Ducter: all
    run:
      config: Debug
    archive:
      config: Release
