# The Ducter iPhone app: a native shell around the phone client the main serves at /app.
# Generate the Xcode project with `xcodegen` (brew install xcodegen); see design/release/ios.md.
name: Ducter
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    # CI overrides both on the xcodebuild command line (MARKETING_VERSION=… CURRENT_PROJECT_VERSION=…).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Ducter:
    type: application
    platform: iOS
    sources:
      - path: Ducter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUCTER_BUNDLE_ID)
        INFOPLIST_FILE: Ducter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ducter/Ducter.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          # App Store / TestFlight builds talk to production APNs (the entitlement is rewritten
          # to "production" by distribution signing; Native.apnsEnv follows the configuration).
          SWIFT_OPTIMIZATION_LEVEL: -O
schemes:
  Ducter:
    build:
      targets:
        Ducter: all
    run:
      config: Debug
    archive:
      config: Release
