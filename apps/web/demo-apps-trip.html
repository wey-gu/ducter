<style>
  * { box-sizing: border-box; }
  body { padding: 18px 18px 28px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--d-muted); font-size: 13px; margin: 0 0 16px; }
  .sum { background: var(--d-card); border-radius: var(--d-radius); padding: 16px; box-shadow: 0 4px 0 var(--d-line); }
  .sum .big { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .sum .of { color: var(--d-muted); font-size: 13px; margin-top: 2px; }
  .bar { height: 10px; border-radius: 6px; background: var(--d-sunken); margin-top: 12px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--d-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
  form { display: grid; grid-template-columns: 1fr 96px; gap: 8px; margin: 18px 0 6px; }
  input { font: inherit; font-size: 15px; height: 42px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--d-card); color: var(--d-ink); box-shadow: inset 0 0 0 1px var(--d-line); min-width: 0; }
  input:focus { outline: 2px solid var(--d-accent); outline-offset: 1px; }
  .cats { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .cat { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--d-sunken); color: var(--d-soft); cursor: pointer; }
  .cat[aria-pressed="true"] { background: var(--d-ink); color: var(--d-bg); }
  .add { grid-column: 1 / -1; height: 44px; border: 0; border-radius: 14px; background: var(--d-accent); color: var(--d-on-accent); font: inherit; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 #c9631f; cursor: pointer; }
  .add:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9631f; }
  h2 { font-size: 13px; color: var(--d-muted); font-weight: 700; margin: 20px 4px 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li { display: flex; align-items: center; gap: 12px; background: var(--d-card); border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 0 var(--d-line); }
  li .dot { width: 10px; height: 10px; border-radius: 4px; flex: none; }
  li .what { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .yuan { font-weight: 800; font-variant-numeric: tabular-nums; }
  li .x { border: 0; background: none; color: var(--d-muted); font-size: 18px; cursor: pointer; padding: 0 2px; }
  .ask { margin-top: 18px; display: flex; gap: 8px; align-items: center; }
  .ask button { font: inherit; font-size: 14px; font-weight: 700; padding: 10px 14px; border-radius: 12px; border: 0; background: var(--d-card); color: var(--d-ink); box-shadow: inset 0 0 0 1px var(--d-line), 0 2px 0 var(--d-line); cursor: pointer; }
  .answer { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--d-sunken); color: var(--d-soft); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .answer:empty { display: none; }
</style>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="sum">
  <div class="big" id="total"></div>
  <div class="of" id="of"></div>
  <div class="bar" id="bar"></div>
  <div class="legend" id="legend"></div>
</div>
<form id="f">
  <input id="what" autocomplete="off" />
  <input id="yuan" inputmode="decimal" autocomplete="off" />
  <div class="cats" id="cats"></div>
  <button class="add" id="addb" type="submit"></button>
</form>
<div id="days"></div>
<div class="ask"><button id="askb" type="button"></button></div>
<div class="answer" id="answer"></div>
<script>
  const zh = ducter.lang.startsWith("zh");
  const W = zh
    ? { title: "北京出差花销", sub: "11 月 18 日到 20 日", of: (b) => "预算 ¥" + b.toLocaleString() + "，还剩 ¥", what: "花在哪", yuan: "多少钱", add: "记一笔", ask: "问 Ducter：报销要准备什么？", cats: { go: "交通", eat: "吃饭", stay: "住宿", other: "其他" } }
    : { title: "Beijing trip expenses", sub: "Nov 18 to 20", of: (b) => "Budget ¥" + b.toLocaleString() + ", left ¥", what: "What for", yuan: "How much", add: "Add it", ask: "Ask Ducter: what do I need for the claim?", cats: { go: "Getting around", eat: "Food", stay: "Hotel", other: "Other" } };
  const C = { go: "#4ba8f0", eat: "#ff8a3d", stay: "#7fd99a", other: "#c7b49a" };
  let cat = "eat";
  const $ = (id) => document.getElementById(id);
  $("title").textContent = W.title;
  $("sub").textContent = W.sub;
  $("what").placeholder = W.what;
  $("yuan").placeholder = W.yuan;
  $("addb").textContent = W.add;
  $("askb").textContent = W.ask;
  function cats() {
    $("cats").innerHTML = "";
    for (const k of Object.keys(C)) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "cat"; b.textContent = W.cats[k];
      b.setAttribute("aria-pressed", String(k === cat));
      b.onclick = () => { cat = k; cats(); };
      $("cats").appendChild(b);
    }
  }
  function draw() {
    const xs = ducter.get("expenses") || [];
    const budget = ducter.get("budget") || 3000;
    const total = xs.reduce((s, x) => s + x.yuan, 0);
    $("total").textContent = "¥" + total.toLocaleString(undefined, { maximumFractionDigits: 2 });
    $("of").textContent = W.of(budget) + Math.max(0, budget - total).toLocaleString();
    const by = {};
    for (const x of xs) by[x.cat] = (by[x.cat] || 0) + x.yuan;
    $("bar").innerHTML = ""; $("legend").innerHTML = "";
    for (const k of Object.keys(C)) {
      if (!by[k]) continue;
      const i = document.createElement("i");
      i.style.width = (100 * by[k] / Math.max(budget, total)) + "%"; i.style.background = C[k];
      $("bar").appendChild(i);
      const s = document.createElement("span");
      s.innerHTML = '<b style="background:' + C[k] + '"></b>';
      s.append(W.cats[k] + " ¥" + by[k].toLocaleString());
      $("legend").appendChild(s);
    }
    const days = {};
    for (const x of xs) (days[x.day] = days[x.day] || []).push(x);
    $("days").innerHTML = "";
    for (const d of Object.keys(days).sort().reverse()) {
      const h = document.createElement("h2");
      const [m, dd] = d.split("-").slice(1).map(Number);
      h.textContent = zh ? m + " 月 " + dd + " 日" : new Date(2026, m - 1, dd).toLocaleDateString("en-US", { month: "short", day: "numeric" });
      const ul = document.createElement("ul");
      for (const x of days[d]) {
        const li = document.createElement("li");
        li.innerHTML = '<span class="dot"></span><span class="what"></span><span class="yuan"></span><button class="x" aria-label="delete">×</button>';
        li.querySelector(".dot").style.background = C[x.cat];
        li.querySelector(".what").textContent = x.what;
        li.querySelector(".yuan").textContent = "¥" + x.yuan.toLocaleString();
        li.querySelector(".x").onclick = () => { ducter.set("expenses", (ducter.get("expenses") || []).filter((y) => y.id !== x.id)); draw(); };
        ul.appendChild(li);
      }
      $("days").append(h, ul);
    }
  }
  $("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const what = $("what").value.trim();
    const yuan = Number($("yuan").value);
    if (!what || !(yuan > 0)) return;
    const xs = ducter.get("expenses") || [];
    const now = new Date();
    xs.push({ id: Date.now(), what, yuan, cat, day: now.toISOString().slice(0, 10) });
    ducter.set("expenses", xs);
    $("what").value = ""; $("yuan").value = "";
    draw();
  });
  $("askb").onclick = async () => {
    $("answer").textContent = "…";
    try { $("answer").textContent = await ducter.ask(W.ask.replace(/^[^：:]*[：:]\s*/, "")); }
    catch (e) { $("answer").textContent = ""; }
  };
  ducter.onChange(draw);
  cats();
  draw();
</script>
