<!doctype html>
<!--
  D511 prototype: 看守中 / Looking after, one place for work Ducter keeps on for the person
  (design/standing-work.md, research/221). Designed, not built: a static page, no core, no
  production code. Data is the author's real setup (hel's PR babysitter in D507's busy shape:
  #11030, #10932 /test, #10847; the 45-minute nowledge-co review loop, D498) and one consumer
  flight watch. Open it from apps/web with query parameters:
    view=onhand | page | made    lang=zh | en    theme=light | dark
    keep=babysitter | review | flight (page and made)    mark=lantern | track | literal
  Shots: .shots/standing-work/ (D75: never in git).
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看守中 · prototype</title>
<link rel="stylesheet" href="static/app.css">
<style>
  body { min-height: 100%; }
  .sw { max-width: 1400px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .sw-top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line-soft); }
  .sw-top .who { font-family: var(--head); font-weight: 800; font-size: var(--lg); margin-right: auto; }
  .sw-tabs { display: flex; gap: 4px; background: var(--sunken); border-radius: var(--pill); padding: 4px; }
  .sw-tabs span { padding: 6px 14px; border-radius: var(--pill); font-size: var(--sm); font-weight: 600; color: var(--ink-muted); white-space: nowrap; }
  .sw-tabs span.on { background: var(--surface); color: var(--ink); box-shadow: var(--knob); }
  .sw-body { flex: 1; display: grid; grid-template-columns: 220px minmax(0, 760px); justify-content: center; gap: 40px; padding: 28px 24px 64px; }
  .sw-body.page { grid-template-columns: 280px minmax(0, 1fr); max-width: 1400px; }
  .sw-col .lbl { font-size: var(--xs); font-weight: 700; color: var(--ink-muted); letter-spacing: 0.04em; margin: 0 0 8px 10px; }
  .sw-proj { display: flex; flex-direction: column; gap: 2px; }
  .sw-proj div { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: var(--r-sm); font-size: var(--md); color: var(--ink-soft); }
  .sw-proj div.on { background: var(--surface); color: var(--ink); box-shadow: var(--knob); font-weight: 600; }
  .sw-proj b { font-weight: 600; color: var(--ink-muted); font-size: var(--sm); }
  .sw-proj b.need { color: var(--needs-ink); }
  .sw-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .sw-head img { width: 72px; height: 72px; object-fit: contain; }
  .sw-head .line { font-family: var(--head); font-weight: 700; font-size: 22px; line-height: 1.3; }
  .sw-sec { margin: 26px 0 8px 4px; font-size: var(--xs); font-weight: 700; color: var(--ink-muted); letter-spacing: 0.04em; }
  .sw-sheet { background: var(--surface); border-radius: 16px; box-shadow: var(--base); overflow: hidden; }
  .sw-sheet.need { box-shadow: 0 4px 0 var(--needs-ledge); }
  .sw-sheet + .sw-sheet { margin-top: 12px; }
  .sw-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 16px; min-height: 60px; }
  .sw-row + .sw-row { border-top: 1px solid var(--line-soft); }
  .sw-row .t { font-size: var(--md); font-weight: 600; line-height: 1.4; }
  .sw-row .l { font-size: var(--sm); color: var(--ink-soft); margin-top: 2px; line-height: 1.5; }
  .sw-row .r { font-size: var(--sm); color: var(--ink-muted); white-space: nowrap; padding-top: 2px; text-align: right; }
  .sw-row .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .sw-facts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; font-size: var(--sm); color: var(--ink-muted); }
  .sw-facts .need { color: var(--needs-ink); font-weight: 600; }
  .sw-facts .wait { color: var(--waiting-ink); }
  .sw-where { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: var(--xs); color: var(--ink-muted); }
  .sw-glyph { width: 32px; height: 32px; border-radius: 50%; background: var(--sunken); display: grid; place-items: center; box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.08); margin-top: 2px; }
  .sw-glyph i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .sw-glyph.flag svg { width: 16px; height: 16px; }
  /* A kept thing on On hand: its head row, then what it holds, set in under its mark. */
  .sw-keep { cursor: pointer; }
  .sw-keep:hover { background: var(--surface-raised); }
  .sw-keep .t { font-size: var(--md); font-weight: 700; }
  .sw-held { padding: 0 16px 10px 68px; }
  .sw-held .h { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line-soft); font-size: var(--sm); }
  .sw-held .h .n { color: var(--ink-soft); }
  .sw-held .h .n b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .sw-held .h .s { color: var(--ink-muted); white-space: nowrap; }
  .sw-held .h .s.need { color: var(--needs-ink); font-weight: 600; }
  .sw-held .h .s.ok { color: var(--done-ink); }
  .sw-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
  .sw-more { font-size: var(--sm); color: var(--ink-muted); padding: 16px 4px; }
  /* The mark */
  .sw-mark { width: 40px; height: 40px; display: grid; place-items: center; }
  .sw-mark svg { width: 40px; height: 40px; overflow: visible; }
  .sw-mark.big, .sw-mark.big svg { width: 64px; height: 64px; }
  .lantern-glow { transform-origin: 20px 23px; }
  .beat .lantern-glow { animation: sw-beat 900ms var(--ease) 1; }
  @keyframes sw-beat { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1); opacity: 0.9; } }
  .lit-up .lantern-glow { animation: sw-lit 1600ms var(--ease) 1 both; }
  @keyframes sw-lit { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .beat .lantern-glow, .lit-up .lantern-glow { animation: none; } }
  /* The opened page */
  .sw-rail .k { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: var(--r-md); align-items: center; }
  .sw-rail .k.on { background: var(--surface); box-shadow: var(--knob); }
  .sw-rail .k .t { font-size: var(--sm); font-weight: 600; line-height: 1.35; }
  .sw-rail .k .l { font-size: var(--xs); color: var(--ink-muted); }
  .sw-rail .k .l.need { color: var(--needs-ink); font-weight: 600; }
  .sw-back { font-size: var(--sm); color: var(--ink-muted); margin: 0 0 14px 4px; font-weight: 600; }
  .sw-page { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; max-width: 1060px; }
  .sw-ph { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: start; margin-bottom: 8px; }
  .sw-ph .kick { font-size: var(--sm); color: var(--ink-muted); font-weight: 600; }
  .sw-ph h1 { font-family: var(--head); font-weight: 800; font-size: var(--t28); line-height: 1.2; margin: 2px 0 8px; letter-spacing: -0.01em; }
  :lang(zh) .sw-ph h1 { letter-spacing: 0; }
  .sw-life { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .sw-chip { font-size: var(--sm); padding: 3px 10px; border-radius: var(--pill); background: var(--sunken); color: var(--ink-soft); white-space: nowrap; }
  .sw-chip.on { background: var(--done-surface); color: var(--done-ink); font-weight: 700; }
  .sw-chip.need { background: var(--needs-surface); color: var(--needs-ink); font-weight: 700; }
  .sw-said { margin: 14px 0 0; padding: 12px 14px; background: var(--sunken); border-radius: var(--r-md); font-size: var(--sm); color: var(--ink-soft); line-height: 1.6; }
  .sw-said b { display: block; font-size: var(--xs); color: var(--ink-muted); font-weight: 700; margin-bottom: 2px; }
  .sw-h2 { font-size: var(--xs); font-weight: 700; color: var(--ink-muted); letter-spacing: 0.04em; margin: 26px 0 8px 4px; }
  .sw-ask { padding: 16px; }
  .sw-ask .q { font-family: var(--head); font-weight: 700; font-size: var(--md); line-height: 1.5; }
  .sw-ask .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .sw-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px; align-items: start; }
  .sw-item + .sw-item { border-top: 1px solid var(--line-soft); }
  .sw-item .t { font-size: var(--md); font-weight: 600; line-height: 1.4; }
  .sw-item .t b { font-weight: 700; margin-right: 6px; }
  .sw-item .st { font-size: var(--sm); margin-top: 2px; }
  .sw-item .st.need { color: var(--needs-ink); font-weight: 600; }
  .sw-item .st.ok { color: var(--done-ink); font-weight: 600; }
  .sw-item .st.work { color: var(--working-ink); }
  .sw-checks { display: flex; gap: 3px; margin-top: 8px; }
  .sw-checks i { width: 10px; height: 10px; border-radius: 3px; background: var(--done-dot); display: block; }
  .sw-checks i.f { background: var(--failed-dot); }
  .sw-checks i.p { background: var(--waiting-dot); }
  .sw-rounds .rd { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; padding: 11px 16px; font-size: var(--sm); align-items: baseline; }
  .sw-rounds .rd + .rd { border-top: 1px solid var(--line-soft); }
  .sw-rounds .rd .tm { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .sw-rounds .rd .why { font-size: var(--xs); color: var(--ink-muted); display: block; }
  .sw-rounds .rd .did { color: var(--ink); line-height: 1.5; }
  .sw-rounds .rd .out { font-size: var(--xs); color: var(--ink-muted); white-space: nowrap; }
  .sw-rounds .rd .out.need { color: var(--needs-ink); font-weight: 700; }
  .sw-rounds .rd .out.told { color: var(--ink-soft); font-weight: 700; }
  .sw-rounds .quiet { padding: 11px 16px; border-top: 1px solid var(--line-soft); font-size: var(--sm); color: var(--ink-muted); display: flex; align-items: center; gap: 8px; }
  .sw-rounds .quiet .pips { display: flex; gap: 3px; }
  .sw-rounds .quiet .pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); display: block; }
  .sw-side > .sw-h2:first-child { margin-top: 4px; }
  .sw-rules { padding: 6px 16px 16px; }
  .sw-rules .ru { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .sw-rules .ru:last-of-type { border-bottom: 0; }
  .sw-rules .ru .k { font-size: var(--xs); font-weight: 700; color: var(--ink-muted); }
  .sw-rules .ru .v { font-size: var(--sm); color: var(--ink); margin-top: 3px; line-height: 1.5; }
  .sw-rules .ru .v + .v { margin-top: 2px; }
  .sw-rules .ru .v.m { color: var(--ink-muted); }
  .sw-rules .acts { display: flex; gap: 8px; padding-top: 14px; }
  .sw-rules .acts .btn { flex: 1; }
  .btn.stop { color: var(--failed-ink); }
  .sw-talk { margin-top: 22px; display: flex; gap: 10px; align-items: center; background: var(--surface); border-radius: var(--r-xl); padding: 10px 10px 10px 18px; box-shadow: var(--base); }
  .sw-talk span { flex: 1; color: var(--ink-muted); font-size: var(--md); }
  .sw-fares { display: flex; align-items: flex-end; gap: 8px; height: 92px; padding: 8px 16px 0; }
  .sw-fares .f { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: var(--xs); color: var(--ink-muted); }
  .sw-fares .f i { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: var(--line-2); display: block; }
  .sw-fares .f.now i { background: var(--accent); }
  .sw-fares .f.now { color: var(--ink); font-weight: 700; }
  .sw-goal { position: relative; margin: 0 16px; border-top: 1.5px dashed var(--done-ink); opacity: 0.7; }
  .sw-goal span { position: absolute; right: 0; top: -18px; font-size: var(--xs); color: var(--done-ink); font-weight: 700; }
  .sw-days { display: flex; gap: 8px; padding: 6px 16px 14px; }
  .sw-days span { flex: 1; text-align: center; font-size: var(--xs); color: var(--ink-muted); }
  /* The first moment: the conversation */
  .sw-conv { max-width: 720px; margin: 0 auto; padding: 28px 24px 64px; width: 100%; }
  .sw-day { text-align: center; font-size: var(--xs); color: var(--ink-muted); margin: 0 0 18px; }
  .sw-me { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .sw-me div { background: var(--user-bubble); color: var(--on-user-bubble); border-radius: var(--bubble); padding: 10px 16px; max-width: 80%; font-size: var(--body); line-height: var(--lh-voice); }
  .sw-it { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
  .sw-it img { width: 36px; height: 36px; object-fit: contain; }
  .sw-it div { background: var(--partner-bubble); color: var(--on-partner-bubble); border-radius: var(--bubble-partner); padding: 10px 16px; max-width: 80%; font-size: var(--body); line-height: var(--lh-voice); box-shadow: var(--base); }
  .sw-card { margin: 6px 0 0 46px; max-width: 520px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--base); padding: 16px; }
  .sw-card .hd { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
  .sw-card .hd .kick { font-size: var(--xs); color: var(--ink-muted); font-weight: 700; }
  .sw-card .hd .t { font-family: var(--head); font-weight: 800; font-size: var(--lg); line-height: 1.3; }
  .sw-card .ls { margin-top: 12px; display: grid; gap: 6px; }
  .sw-card .ls div { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; font-size: var(--sm); }
  .sw-card .ls div span:first-child { color: var(--ink-muted); }
  .sw-card .first { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--done-surface); color: var(--done-ink); font-size: var(--sm); font-weight: 600; }
  .sw-card .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .sw-note { margin: 10px 0 0 46px; max-width: 520px; font-size: var(--sm); color: var(--ink-muted); line-height: 1.6; display: flex; gap: 8px; }
  .sw-note img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  /* Phone and the narrow web */
  @media (max-width: 760px) {
    .sw-top { padding: 10px 16px; }

    .sw-tabs { flex: 1; justify-content: space-between; }

    .sw-col.projects, .sw-rail { display: none; }
    .sw-lens { display: flex; gap: 6px; overflow: hidden; margin-bottom: 14px; }
    .sw-lens span { font-size: var(--sm); padding: 5px 12px; border-radius: var(--pill); background: var(--sunken); color: var(--ink-soft); white-space: nowrap; }
    .sw-lens span.on { background: var(--surface); color: var(--ink); box-shadow: var(--knob); font-weight: 600; }
    .sw-head img { width: 56px; height: 56px; }
    .sw-head .line { font-size: 20px; }
    .sw-row { grid-template-columns: 36px minmax(0, 1fr); padding: 12px 14px; }
    .sw-row .r { grid-column: 2; text-align: left; padding-top: 0; }
    .sw-held { padding: 0 14px 8px 62px; }
    .sw-held .h { grid-template-columns: 18px minmax(0, 1fr); }
    .sw-held .h .s { grid-column: 2; white-space: normal; }
    .sw-page { display: block; }
    .sw-ph { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
    .sw-mark.big, .sw-mark.big svg { width: 52px; height: 52px; }
    .sw-ph h1 { font-size: var(--t20); }
    .sw-item { grid-template-columns: 32px minmax(0, 1fr); padding: 12px 14px; }
    .sw-item .r { grid-column: 2; }
    .sw-side { margin-top: 8px; }
    .sw-rounds .rd { grid-template-columns: 52px minmax(0, 1fr); }
    .sw-rounds .rd .out { grid-column: 2; }
    .sw-conv { padding: 18px 16px 48px; }
    .sw-card, .sw-note { margin-left: 0; }
    .sw-card .ls div { grid-template-columns: 76px minmax(0, 1fr); }
  }
  @media (min-width: 761px) { .sw-lens { display: none; } }

</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const lang = q.get("lang") === "en" ? "en" : "zh";
const theme = q.get("theme") === "dark" ? "dark" : "light";
const view = q.get("view") || "onhand";
const keepId = q.get("keep") || (view === "made" ? "flight" : "babysitter");
const markKind = q.get("mark") || "lantern";
document.documentElement.lang = lang === "zh" ? "zh" : "en";
document.documentElement.dataset.theme = theme;
const w = (zh, en) => (lang === "zh" ? zh : en);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const art = (n) => `static/art/${n}.webp`;
document.title = w("看守中", "Looking after") + " · prototype";

// ---- The mark: a clay lantern (research/221's leader), or the runners-up for comparison ----
// States: on (lit), beat (a round just did something), paused (dim), done (out, with a tick), stopped (out).
function mark(state, big) {
  const cls = `sw-mark${big ? " big" : ""}${state === "beat" ? " beat" : ""}${state === "litup" ? " lit-up" : ""}`;
  const lit = state === "on" || state === "beat" || state === "litup";
  const glowOp = lit ? 1 : state === "paused" ? 0.32 : 0;
  if (markKind === "track") {
    const flag = state !== "open";
    return `<span class="${cls}"><svg viewBox="0 0 40 40"><ellipse cx="20" cy="22" rx="16" ry="11" fill="var(--sunken)" stroke="var(--line-2)" stroke-width="3"/><ellipse cx="20" cy="22" rx="9" ry="4.5" fill="var(--surface)"/>${flag ? '<path d="M31 10v8" stroke="var(--ink-muted)" stroke-width="1.5"/><path d="M31 10l6 2-6 2z" fill="var(--done-dot)"/>' : ""}<circle cx="${state === "paused" ? 37 : 9}" cy="${state === "paused" ? 32 : 18}" r="4" fill="${lit ? "var(--accent)" : "var(--faint)"}" stroke="var(--press-accent)" stroke-width="1"/></svg></span>`;
  }
  if (markKind === "literal") {
    return `<span class="${cls}"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="var(--sunken)"/><path d="M27 15a8.5 8.5 0 1 0 1.6 7" fill="none" stroke="${lit ? "var(--ink-soft)" : "var(--faint)"}" stroke-width="2.4" stroke-linecap="round"/><path d="M28.6 10.5v5.2h-5.2" fill="none" stroke="${lit ? "var(--ink-soft)" : "var(--faint)"}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  }
  const done = state === "done";
  const out = done || state === "stopped";
  return `<span class="${cls}"><svg viewBox="0 0 40 40" aria-hidden="true">
    <defs><radialGradient id="g${state}${big ? "b" : ""}" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#fff3c4"/><stop offset="0.45" stop-color="var(--waiting-dot)"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient></defs>
    <path d="M15 7.5a5 5 0 0 1 10 0" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round"/>
    <path d="M12.5 12h15l-2-4h-11z" fill="var(--ink-soft)"/>
    <rect x="11" y="12" width="18" height="21" rx="5" fill="${out ? "var(--sunken)" : "#fff1d6"}" stroke="var(--ink-soft)" stroke-width="2"/>
    <circle class="lantern-glow" cx="20" cy="23" r="9" fill="url(#g${state}${big ? "b" : ""})" opacity="${glowOp}"/>
    <path d="M17.5 25.5c0-3 2.5-4 2.5-7 1.6 2 2.5 3.6 2.5 6a2.5 2.5 0 0 1-5 1z" fill="${out ? "var(--faint)" : "var(--accent)"}" opacity="${out ? 0.5 : glowOp || 0.35}"/>
    <path d="M10 33h20" stroke="var(--ink-soft)" stroke-width="3" stroke-linecap="round"/>
    ${done ? '<circle cx="31" cy="31" r="7" fill="var(--done-dot)" stroke="var(--surface)" stroke-width="2"/><path d="M27.8 31.2l2.2 2.1 4-4.3" fill="none" stroke="var(--done-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' : ""}
  </svg></span>`;
}
const flag = `<span class="sw-glyph flag"><svg viewBox="0 0 16 16"><path d="M4 2v12" stroke="var(--needs-ink)" stroke-width="1.6" stroke-linecap="round"/><path d="M4.5 2.5h8l-2 3 2 3h-8z" fill="var(--needs-dot)"/></svg></span>`;
const dotGlyph = (c) => `<span class="sw-glyph"><i style="background:var(${c})"></i></span>`;

// ---- The data: the author's real setup, as the home would hand it to the clients ----
const NAME = "Ducter";
const keeps = {
  babysitter: {
    state: "beat",

    : [[w("什么时候", "When"), w("有 PR 交过来，或它手上的 PR 有变化", "A PR handed over, or a change on one it holds")], [w("出声", "Speaks"), w("要你定才问；能合并说一句", "Asks only when needed; one line when one can merge")], [w("到什么时候", "Until"), w("每个 PR 能合并为止", "Each PR until it can merge")], [w("在哪儿", "Where"), w("hel 上，Codex", "On hel, with Codex")]];
  const first = flight ? w("第一次：现在 ¥2,340，还没到 ¥2,000", "First look: ¥2,340 now, not yet under ¥2,000") : w("Nowledge Mem 里登记好了，你的 agent 现在就能找到它", "Listed in Nowledge Mem; your agents can find it now");
  return `${bar("conv")}<div class="sw-conv"><div class="sw-day">${w("今天 08:47", "Today 08:47")}</div>
    <div class="sw-me"><div>${esc(me)}</div></div>
    <div class="sw-it"><img src="${art("idle")}" alt=""><div>${esc(say)}</div></div>
    <div class="sw-card"><div class="hd">${mark("litup", true)}<div><div class="kick">${w("看守中", "Looking after")}</div><div class="t">${esc(k.title)}</div></div></div>
      <div class="ls">${ls.map(([a, b]) => `<div><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("")}</div>
      <div class="first">${esc(first)}</div>
      <div class="acts"><button class="btn sm secondary">${w("打开", "Open")}</button><button class="btn sm secondary">${w("改一下", "Change")}</button><button class="btn sm secondary">${w("撤销", "Undo")}</button></div></div>
    <div class="sw-note"><img src="${art("idle")}" alt=""><span>${w("它在手头的事的「看守中」里，一直亮着灯。平时不出声，有变化才说一句，要你定的时候才问你。", "It's in On hand under Looking after, its light on. It stays quiet, says a line when something changes, and asks only when it needs you.")}</span></div>
  </div>`;
}

document.getElementById("app").innerHTML = `<div class="sw">${view === "page" ? page() : view === "made" ? made() : onhand()}</div>`;
</script>
</body>
