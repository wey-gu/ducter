<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Ducter</title>
    <meta name="theme-color" content="#FFF6EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17120E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ducter" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="app/apple-touch-icon.png" />
    <link rel="icon" href="app/icon-192.png" />
    <link rel="preload" href="app/bricolage.woff" as="font" type="font/woff" crossorigin />
    <link rel="stylesheet" href="app/app.css" />
  </head>
  <body>
    <!-- D474: the page's own ground, shown only if the app hasn't drawn itself a few seconds in (its
         code still on the way, or refused): the partner waiting, the words in both languages (the
         page can't know which yet), and Try again. The app replaces it the moment it draws. -->
    <div id="app"><main class="boot-wait static" role="status">
      <div class="face"><span class="avatar breathe" style="width: 120px; height: 120px"><img class="on" src="app/art/working.webp" alt="" /></span></div>
      <div lang="zh"><h1>正在打开你的 Ducter…</h1><p>比平常慢一点，还在等它回话。</p><a class="btn primary lg" href="app"><span class="lbl">再试一次</span></a></div>
      <div lang="en"><h1>Opening your Ducter…</h1><p>Taking longer than usual. Still waiting for it to answer.</p><a class="btn secondary" href="app"><span class="lbl">Try again</span></a></div>
    </main></div>
    <script type="module" src="app/app.js"></script>
  </body>
</html>
