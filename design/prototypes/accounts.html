<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts and proactive help</title>
<!--
  Prototype for design/connectors.md Part A (drafts D165, D166). Decides nothing: it shows the note.
  Open from the repo (art loads by relative path from apps/desktop and apps/site).
  Tokens are Pebble's (design/ui.md, apps/web/static/app.css), shared with device-card.html (D161).
  URL: ?lang=en · ?still=1 · ?only=<board id without b->
  Data: the author's real setup (oo with two Gmail accounts, a work calendar, Discord, GitHub) and
  the finds connectors.md §21 already uses. App marks are plain drawn glyphs; the build uses each
  brand's mark where its guidelines allow (D146's rule).
-->
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("../../apps/web/static/bricolage.woff") format("woff"); font-weight: 200 800; }
@font-face { font-family: "Ducter Rounded SC"; src: url("../../apps/web/static/fonts/rounded-sc-bold.woff2") format("woff2"); font-weight: 700 900; size-adjust: 94%; unicode-range: U+2E80-9FFF, U+3000-303F, U+F900-FAFF, U+FF00-FFEF; }
:root {
  --bg: #fff6ea; --bg-deep: #fcecd7; --surface: #ffffff; --sunken: #f7ebda; --surface-sunken: #f3e6d3;
  --ink: #2b2118; --ink-soft: #4a3d30; --ink-muted: #75654f; --faint: #c7b49a; --accent: #ff8a3d; --accent-ledge: #c9642a;
  --line: #e8d9c4; --line-2: #e0c9b0; --line-soft: #f3e6d3;
  --working-ink: #174a75; --working-dot: #3f7fb8; --needs-surface: #ffe3cf; --needs-ink: #8a3a0c;
  --done-ink: #1f5e2f; --dusk-ink: #4b4a7a; --fail-surface: #fbdde4; --fail-ink: #8a1f3b;
  --base: 0 4px 0 var(--line); --press-primary: #140d07; --primary-top: #3b2d22; --press-quiet: #cdae8c;
  --drop: 0 7px 12px -4px rgba(43,33,24,.28); --floating: 0 10px 32px rgba(43,33,24,.14);
  --font: "Bricolage Grotesque", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --head: "Bricolage Grotesque", "Ducter Rounded SC", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --r-sm: 12px; --r-btn: 14px; --r-md: 16px; --r-tray: 18px; --r-lg: 24px; --r-xl: 28px;
  --press: 70ms; --enter: 220ms; --bouncy: cubic-bezier(.34,1.56,.64,1); --snappy: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); padding: 0 24px 80px; }
:lang(zh) body { line-height: 1.75; }
h1, h2, h3, h4 { font-family: var(--head); margin: 0; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }

/* page chrome (prototype only) */
.top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 16px 0 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); }
.top h1 { font-size: 20px; font-weight: 800; }
.top .sub { color: var(--ink-muted); font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-sunken); border-radius: var(--r-md); padding: 4px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; color: var(--ink-muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.board { max-width: 1280px; margin: 40px auto 0; }
.board > header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.board > header h2 { font-size: 20px; font-weight: 800; }
.board > header .id { font: 700 12px ui-monospace, Menlo, monospace; color: var(--ink-muted); background: var(--surface-sunken); border-radius: 8px; padding: 2px 8px; }
.board > header p { margin: 0; color: var(--ink-muted); font-size: 13px; flex: 1 0 100%; }
.row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.cap { font-size: 12px; color: var(--ink-muted); margin: 8px 4px 0; max-width: 400px; }
.frame { background: var(--bg-deep); border-radius: var(--r-xl); padding: 24px; position: relative; }

/* ===== the source card (character sheet, D166) ===== */
.sc { width: 400px; max-width: 100%; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--base); padding: 6px 22px 16px; position: relative; }
.sc.phone { width: 100%; padding: 2px 16px 14px; }
.sc .hero { position: relative; height: 150px; display: flex; justify-content: center; align-items: flex-end; }
.sc.phone .hero { height: 132px; }
.sc .ground { position: absolute; bottom: 6px; left: 50%; width: 190px; height: 34px; margin-left: -95px; border-radius: 50%; background: radial-gradient(closest-side, var(--surface-sunken), var(--sunken) 70%, transparent); }
.sc .mb { position: relative; width: 112px; margin-bottom: 12px; filter: drop-shadow(0 6px 5px rgb(60 50 20 / .18)); }
.sc.phone .mb { width: 92px; }
.sc .mb.grey { filter: grayscale(.75) opacity(.7); }
.sc .mist { position: absolute; inset: 26% 22% 6%; background: radial-gradient(closest-side, rgb(255 255 255 / .75), transparent); border-radius: 50%; }
.mb .lid { transform-origin: 30% 42%; transition: transform 300ms var(--bouncy); }
.mb.looking .lid { transform: rotate(-9deg) translateY(-2px); }
.sc .name { text-align: center; font: 800 25px/1.25 var(--head); margin-top: 2px; }
.sc .status { text-align: center; font-size: 15px; color: var(--ink-muted); margin: 0 0 14px; }
.sc .status b { color: var(--ink); font-weight: 700; }
.sc .status.fail { color: var(--fail-ink); font-weight: 700; }
.sc .status.quiet { color: var(--dusk-ink); }

/* app tiles on the sunken tray */
.tray { background: var(--sunken); border-radius: var(--r-tray); padding: 12px 6px 8px; display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; border: 0; background: none; cursor: pointer; padding: 4px 0 3px; border-radius: 14px; position: relative; animation: enter var(--enter) var(--snappy) both; }
.tile:hover { background: rgb(255 255 255 / .55); }
.tile.sel { background: var(--surface); box-shadow: 0 2px 0 var(--line-2); }
.tile .t { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; position: relative;
  background: linear-gradient(160deg, #fffdf8 0%, #f6ecdd 70%, #ead9c2 100%);
  box-shadow: inset 0 2px 0 rgb(255 255 255 / .9), inset 0 -3px 4px rgb(120 90 50 / .14), 0 3px 0 #dcc6a8, 0 5px 6px rgb(60 50 20 / .18); transition: transform var(--press) ease-out; }
.tile:active .t { transform: translateY(2px); }
.tile .t svg { width: 30px; height: 30px; }
.tile span { font-size: 12px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; line-height: 1.3; }
.tile small { font-size: 11px; font-weight: 600; color: var(--ink-muted); line-height: 1.1; margin-top: -2px; }
.tile.off .t { filter: saturate(.25) opacity(.7); box-shadow: inset 0 2px 0 rgb(255 255 255 / .8), 0 1px 0 #dcc6a8; }
.tile.off span { color: var(--ink-muted); font-weight: 600; }
.tile.bad .t { filter: grayscale(1) opacity(.55); }
.tile.add .t { background: rgb(255 255 255 / .35); box-shadow: none; outline: 2px dashed var(--line-2); outline-offset: -2px; color: var(--ink-muted); font: 700 22px var(--font); }
.tile.add span { color: var(--ink-muted); font-weight: 600; }
.tile .pip { position: absolute; right: 9px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--working-dot); box-shadow: 0 0 0 2.5px var(--sunken); }

.detail { position: relative; margin-top: 10px; background: var(--surface); border-radius: var(--r-md); box-shadow: inset 0 0 0 1px var(--line), 0 2px 0 var(--line); padding: 14px 16px 10px; animation: enter var(--enter) var(--snappy); }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.detail::before { content: ""; position: absolute; top: -7px; left: var(--notch, 50%); width: 12px; height: 12px; background: var(--surface); transform: translateX(-50%) rotate(45deg); box-shadow: -1px -1px 0 var(--line); }
.detail .dh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.detail .dh b { font-size: 15px; }
.detail .dh small { font-size: 13px; color: var(--ink-muted); }
.detail .ln { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.detail .ln i { font-style: normal; color: var(--ink-muted); }
.detail .sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 14px; font-weight: 700; }
.detail .sw small { display: block; font-weight: 500; font-size: 12px; color: var(--ink-muted); }
.detail .foot2 { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; gap: 4px; }
.switch { width: 44px; height: 26px; border-radius: 13px; background: var(--line-2); position: relative; border: 0; cursor: pointer; transition: background 160ms; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgb(43 33 24 / .18); transition: transform 240ms var(--bouncy); }
.switch.on { background: var(--ink); }
.switch.on::after { transform: translateX(18px); }

.via { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--ink-muted); text-align: center; }
.more { border: 0; background: none; cursor: pointer; color: var(--ink-muted); font-weight: 800; letter-spacing: 1px; padding: 0 6px; border-radius: 8px; height: 24px; }
.more:hover, .more[aria-expanded="true"] { background: var(--sunken); color: var(--ink); }
.reads { margin-top: 8px; border-radius: 12px; background: var(--bg); padding: 8px 12px; font-size: 13px; animation: enter 200ms var(--snappy); }
.reads .r { display: flex; gap: 8px; padding: 3px 0; color: var(--ink-soft); }
.reads .r time { color: var(--ink-muted); width: 44px; flex: none; font-variant-numeric: tabular-nums; }
.reads .hon { color: var(--ink-muted); border-top: 1px solid var(--line-soft); margin-top: 6px; padding-top: 6px; }
.dfoot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dfoot .ask { flex: 1 1 14em; font-size: 13px; color: var(--ink-soft); }

/* proactive chips (single choice) */
.pchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pc { height: 38px; padding: 0 14px; border-radius: var(--r-btn); border: 0; cursor: pointer; font-size: 14px; font-weight: 700; white-space: nowrap; transition: transform var(--press) ease-out; }
.pc.off { background: var(--sunken); color: var(--ink-muted); box-shadow: 0 2px 0 var(--line); }
.pc.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink), 0 3px 0 var(--line-2); }
.pc:active { transform: translateY(2px); }
.pc.squish { animation: squish 240ms var(--bouncy); }
@keyframes squish { 0% { transform: translateY(2px) scale(1.06, .94); } 100% { transform: none; } }
.ptitle { font: 800 15px var(--head); margin: 0 0 8px 2px; }
.pnote { font-size: 13px; color: var(--ink-muted); margin: 8px 2px 0; }

/* buttons */
.btn { border: 0; cursor: pointer; font-weight: 700; font-size: 15px; border-radius: var(--r-btn); padding: 0 18px; height: 44px; transition: transform var(--press) ease-out, box-shadow var(--press) ease-out; white-space: nowrap; }
.btn.sm { height: 36px; font-size: 13px; padding: 0 14px; border-radius: var(--r-sm); }
.btn.primary { color: #fff6ea; background: linear-gradient(var(--primary-top), var(--ink)); box-shadow: inset 0 1.5px 0 rgb(255 246 234 / .26), 0 3px 0 var(--press-primary), var(--drop); }
.btn.secondary { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px rgb(43 33 24 / .09), 0 3px 0 var(--press-quiet); }
.btn.text { background: none; color: var(--ink-soft); padding: 0 8px; }
.btn.text:hover { background: var(--sunken); }
.btn.danger { background: none; color: var(--fail-ink); padding: 0 8px; }
.btn.danger:hover { background: var(--fail-surface); }
.btn:active { transform: translateY(3px); box-shadow: none; }
.qlink { font-size: 13px; font-weight: 700; color: var(--ink-soft); border: 0; background: none; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.qlink:hover { background: var(--sunken); }

/* the Mac's Accounts page */
.mac { width: 100%; min-width: 980px; background: var(--bg); border-radius: var(--r-xl); box-shadow: inset 0 0 0 1px var(--line); display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }
.macwrap { overflow-x: auto; }
.rail { background: #fffaf2; border-right: 1px solid var(--line); padding: 22px 12px; display: flex; flex-direction: column; gap: 4px; }
.rail .it { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 10px; border-radius: 14px; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.rail .it.sel { background: var(--surface); box-shadow: 0 3px 0 var(--line); color: var(--ink); }
.rail .it img { width: 30px; height: 30px; object-fit: contain; }
.macmain { padding: 30px 36px 40px; }
.macmain h3 { font-size: 24px; font-weight: 800; }
.macmain .lede { color: var(--ink-muted); font-size: 13px; margin: 2px 0 20px; }
.cards { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; margin-top: 20px; }
.addq { margin-top: 16px; }

/* conversation (quiet-conversation.md bubbles) */
.convo { width: 560px; max-width: 100%; display: flex; flex-direction: column; gap: 10px; }
.convo.phone { width: 100%; }
.bub { max-width: 92%; padding: 12px 16px; font-size: 16px; line-height: 1.65; }
:lang(zh) .bub { line-height: 1.8; }
.bub.you { align-self: flex-end; background: var(--accent); color: var(--ink); border-radius: 20px 20px 6px 20px; }
.bub.partner { align-self: flex-start; background: var(--surface); border-radius: 20px 20px 20px 6px; box-shadow: var(--base); animation: enter var(--enter) var(--snappy); }
.bub p { margin: 0; }
.bub p + p { margin-top: 8px; }
.bub .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
.bub .how { font-size: 13px; color: var(--ink-muted); margin-top: 6px; }
.bub .how summary { cursor: pointer; font-weight: 700; color: var(--ink-soft); list-style: none; }
.bub .how summary::-webkit-details-marker { display: none; }
.bub .how summary::after { content: " ›"; }
.bub .how[open] summary::after { content: " ⌄"; }
.bub .how ul { margin: 4px 0 0; padding-left: 18px; }
.sysline { align-self: center; font-size: 12px; color: var(--ink-muted); background: var(--sunken); border-radius: 10px; padding: 3px 12px; }
.find { border-top: 1px solid var(--line-soft); padding-top: 10px; margin-top: 10px; }
.find .k { font-size: 12px; font-weight: 800; color: var(--ink-muted); letter-spacing: .02em; }
.find .fb { display: flex; gap: 2px; margin-left: auto; }
.metarow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 4px; }
.metarow .how { margin-top: 0; }
.convo.phone .bub { max-width: 100%; font-size: 15px; padding: 12px 14px; }
.find .acts { margin-top: 8px !important; }
.find .fb button { border: 0; background: none; font-size: 12px; font-weight: 700; color: var(--ink-muted); padding: 2px 6px; border-radius: 6px; cursor: pointer; }
.find .fb button:hover { background: var(--sunken); color: var(--ink-soft); }
.find.muted { opacity: .55; }
.said { font-size: 13px; color: var(--done-ink); font-weight: 700; margin-top: 4px; animation: enter var(--enter) var(--snappy); }
.leftout { font-size: 13px; color: var(--ink-muted); border-top: 1px solid var(--line-soft); padding-top: 8px; margin-top: 10px; }
.waitline { align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-muted); }
.waitline img { width: 34px; }
.dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-muted); margin: 0 1.5px; animation: dot 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { opacity: .25; } }
.taskcard { align-self: flex-start; width: 92%; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--base); padding: 12px 16px; animation: enter var(--enter) var(--snappy); }
.taskcard b { font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--ink-muted); margin-top: 4px; }
.meta .working { color: var(--working-ink); font-weight: 700; }
.meta .done { color: var(--done-ink); font-weight: 700; }
.meta img { width: 20px; height: 20px; vertical-align: -5px; margin-right: 3px; }
.meta .d { color: var(--faint); }

/* conversation windows */
.win { width: 620px; max-width: 100%; background: var(--bg); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line), var(--floating); overflow: hidden; }
.win .bar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: #fffaf2; }
.win .bar img { width: 34px; }
.win .bar b { font: 800 16px var(--head); }
.win .bar small { display: block; font-size: 12px; color: var(--ink-muted); margin-top: -2px; }
.win .bar small.quietday { color: var(--done-ink); font-weight: 700; }
.win .body { padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }

/* rules list */
.rules { width: 520px; max-width: 100%; }
.rcard { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--base); }
.rrow { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 20px; }
.rrow + .rrow { border-top: 1px solid var(--line-soft); }
.rrow .tx { flex: 1; }
.rrow .tx b { display: block; font-size: 15px; }
.rrow .tx small { font-size: 13px; color: var(--ink-muted); }
.rrow.new { animation: enter var(--enter) var(--snappy); background: linear-gradient(90deg, var(--needs-surface), transparent 60%); border-radius: var(--r-lg); }

/* phone */
.phonef { width: 390px; height: 820px; background: var(--bg); border-radius: 40px; box-shadow: 0 0 0 10px #2b2118, var(--floating); overflow: hidden; position: relative; flex: none; }
.phonef .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 54px 16px 30px; }
.phonef .nav { display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
.phonef .pt { font: 800 28px var(--head); margin: 0 4px 12px; }
.phonef .pbar { display: flex; align-items: center; gap: 10px; margin: -6px 0 14px; }
.phonef .pbar img { width: 44px; }
.phonef .pbar b { font: 800 18px var(--head); display: block; }
.phonef .pbar small { font-size: 12px; color: var(--ink-muted); }
.lock { position: absolute; inset: 0; background: linear-gradient(170deg, #5b6f86 0%, #9a8c7c 55%, #c9a989 100%); color: #fff; padding: 64px 14px 20px; }
.lock .time { text-align: center; font: 300 78px/1 -apple-system, "SF Pro Display", var(--font); letter-spacing: -1px; }
.lock .date { text-align: center; font-size: 17px; font-weight: 600; opacity: .9; margin-bottom: 36px; }
.notif { background: rgb(255 255 255 / .72); backdrop-filter: blur(20px); color: #1c1c1e; border-radius: 20px; padding: 11px 14px; display: grid; grid-template-columns: 38px 1fr; gap: 0 10px; margin-bottom: 8px; animation: enter 400ms var(--snappy) both; }
.notif img { width: 38px; height: 38px; border-radius: 9px; background: var(--bg); grid-row: span 3; }
.notif .h { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.notif .h small { font-weight: 500; color: #555; font-size: 13px; }
.notif .tx { font-size: 14px; line-height: 1.35; }
.notif .lvl { font-size: 12px; color: #6a4b2f; font-weight: 700; }

/* before (today's row, redrawn from partner.go) */
.old { width: 600px; max-width: 100%; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--base); padding: 18px 22px; font-size: 13px; }
.old .rw { display: flex; gap: 14px; align-items: center; }
.old .rw b { font-size: 14px; }
.old .m { color: var(--ink-muted); }
.old .ap { color: var(--ink-soft); font-weight: 600; }
.old .bt { margin-left: auto; font-weight: 700; color: var(--ink-soft); }
.old .add { display: flex; justify-content: flex-end; border-top: 1px solid var(--line-soft); margin-top: 14px; padding-top: 12px; }
.fixes { margin: 0; padding-left: 20px; font-size: 13px; color: var(--ink-soft); }
.fixes li + li { margin-top: 4px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
body.still *, body.still *::before, body.still *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div class="top">
  <h1 data-t="title"></h1>
  <span class="sub" data-t="subtitle"></span>
  <span style="flex:1"></span>
  <div class="seg" role="group" aria-label="language"><button data-lang="zh" aria-pressed="true">中文</button><button data-lang="en" aria-pressed="false">English</button></div>
  <div class="seg" role="group" aria-label="motion"><button data-motion="full" aria-pressed="true" data-t="motionFull"></button><button data-motion="still" aria-pressed="false" data-t="motionStill"></button></div>
</div>

<section class="board" id="b-before">
  <header><span class="id">before → after</span><h2 data-t="baH"></h2><p data-t="baP"></p></header>
  <div class="row">

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; document.querySelectorAll("[data-lang]").forEach((x) => x.setAttribute("aria-pressed", x === b)); return render(); }
  if (b.dataset.motion) { document.body.classList.toggle("still", b.dataset.motion === "still"); document.querySelectorAll("[data-motion]").forEach((x) => x.setAttribute("aria-pressed", x === b)); return; }
  const k = b.dataset.k;
  if (b.dataset.tile) { const s = st(k); s.open = s.open === b.dataset.tile ? null : b.dataset.tile; return render(); }
  if (b.dataset.watch) { const s = st(k); const src = Object.values(sources()).flatMap((x) => x.apps).find((a) => a.id === b.dataset.watch); s.watch[b.dataset.watch] = !(s.watch[b.dataset.watch] ?? src.watch); return render(); }
  if (b.dataset.out) { const s = st(k); s.out[b.dataset.out] = !s.out[b.dataset.out]; return render(); }
  if ("reads" in b.dataset) { const s = st(k); s.reads = !s.reads; if (s.reads) { s.looking = true; setTimeout(() => { s.looking = false; render(); }, 600); } return render(); }
  if ("stop" in b.dataset) { const s = st(k); s.stop = !s.stop; return render(); }
  if (b.dataset.pro) { PRO = +b.dataset.pro; render(); const n = document.querySelector(`[data-k="${k}"][data-pro="${PRO}"]`); if (n) n.classList.add("squish"); return; }
  if (b.dataset.first === "go") { FIRST = 1; render(); setTimeout(() => { FIRST = 2; render(); }, 1400); return; }
  if (b.dataset.first === "no") { FIRST = 3; FIRSTPICK = 3; return render(); }
  if (b.dataset.pick) { FIRST = 3; FIRSTPICK = +b.dataset.pick; PRO = FIRSTPICK; return render(); }
  if (b.dataset.useful) { USEFUL.add(b.dataset.useful); return render(); }
  if (b.dataset.mute) { MUTED.add(b.dataset.mute); if (b.dataset.mute === "hotel") RULE_NEW = true; return render(); }
  if (b.dataset.aha === "go") { AHA = 1; render(); setTimeout(() => { AHA = 2; render(); }, 1800); return; }
});

/* ?lang=en · ?still=1 · ?only=<board> · ?open=<scenario> for screenshots */
const q = new URLSearchParams(location.search);
if (q.get("still")) { document.body.classList.add("still"); document.querySelectorAll("[data-motion]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.motion === "still")); }
document.querySelectorAll("[data-lang]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.lang === lang));
const open = q.get("open") || "";
if (open.includes("tile")) { st("a").open = "gw"; st("m1").open = "gw"; st("p2").open = "dc"; }
if (open.includes("reads")) { st("m1").reads = true; }
if (open.includes("first")) { FIRST = 2; }
if (open.includes("picked")) { FIRST = 3; FIRSTPICK = 1; }
if (open.includes("aha")) { AHA = 2; }
if (open.includes("muted")) { MUTED.add("hotel"); RULE_NEW = true; }
if (open.includes("stop")) { st("m4").stop = true; }
render();
const only = q.get("only");
if (only) document.querySelectorAll(".board").forEach((b) => { if (b.id !== "b-" + only) b.remove(); });
</script>
